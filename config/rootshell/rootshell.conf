# rootshell on the iPad, reaching this Mac over SSH.
# Format: key = value. An active key overrides the app's own setting on every
# device that loads this file. Keys: https://rootshell.com/settings-sync.html
#
# Load it on the iPad: Settings > Privacy & Data > Config File > choose
# iCloud Drive/rootshell/rootshell.conf. After an edit here, publish it:
#   cp config/rootshell/rootshell.conf ~/Library/Mobile\ Documents/com~apple~CloudDocs/rootshell/

# Every kitty pane on the Mac is a zmx session named <folder>-<uuid>. Sorted
# by name they group by folder; the default (attachedFirst) is no order at all
# while kitty holds every session attached.
session-discovery-sort-order = alphabetical

# The session auto-start attaches or creates when the profile's own Session
# Name is empty: one scratch shell, easy to tell apart from kitty's panes.
zmx-session-name = ipad

# pi reports done and blocked over OSC 7501; the default notifies on blocked only.
agent-notification-policy = blockedAndDone

# Left at the default on purpose: terminal-type-remote = xterm-256color.
# The Mac has no xterm-ghostty terminfo entry.

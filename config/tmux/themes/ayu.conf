# Ayu — matches kitty current-theme.conf (bg #0e1419, accent #f19618)
# Transparent bar over the terminal background, one orange accent.
set -g status-style "bg=default,fg=#5c6773"
set -g status-left "#{?client_prefix,#[fg=#0e1419,bg=#f19618,bold] ^ ,#[fg=#5c6773] _ }#[fg=#36a3d9,bg=default,bold] #S  "
set -g status-left-length 30
set -g status-right "#[fg=#5c6773]%H:%M "
set -g status-right-length 10
set -g window-status-separator " "
set -g window-status-format "#[fg=#5c6773] #I:#W "
set -g window-status-current-format "#[fg=#0e1419,bg=#f19618,bold] #I:#W "
set -g pane-border-style "fg=#243340"
set -g pane-active-border-style "fg=#f19618"
set -g message-style "fg=#0e1419,bg=#e6c446"
set -g message-command-style "fg=#0e1419,bg=#e6c446"
set -g mode-style "fg=#e5e1cf,bg=#243340"
set -g clock-mode-colour "#f19618"

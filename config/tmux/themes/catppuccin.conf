# Catppuccin Mocha — rounded-pill look, hand-rolled (no plugin, no TPM).
# Solid bar; session pill flips mauve -> peach while the prefix is armed.
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[fg=#{?client_prefix,#fab387,#cba6f7},bg=#1e1e2e]#[fg=#1e1e2e,bg=#{?client_prefix,#fab387,#cba6f7},bold] #S #[fg=#{?client_prefix,#fab387,#cba6f7},bg=#1e1e2e] "
set -g status-left-length 30
set -g status-right "#[fg=#313244,bg=#1e1e2e]#[fg=#a6adc8,bg=#313244] %H:%M #[fg=#313244,bg=#1e1e2e]"
set -g status-right-length 12
set -g window-status-separator ""
set -g window-status-format "#[fg=#6c7086] #I:#W "
set -g window-status-current-format "#[fg=#fab387,bg=#1e1e2e]#[fg=#1e1e2e,bg=#fab387,bold]#I:#W#[fg=#fab387,bg=#1e1e2e]"
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
set -g message-style "fg=#1e1e2e,bg=#fab387"
set -g message-command-style "fg=#1e1e2e,bg=#fab387"
set -g mode-style "fg=#cdd6f4,bg=#45475a"
set -g clock-mode-colour "#cba6f7"

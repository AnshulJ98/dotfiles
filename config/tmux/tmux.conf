# ~/.config/tmux/tmux.conf
# Minimal baseline for tmux 3.7c on macOS + kitty. No plugins, no manager.
# Every line changes a verified default; anything absent is covered by a
# 3.5/3.6+ default (escape-time is 10ms, COLORTERM gives truecolor, OSC 52
# clipboard is auto-detected, Homebrew tmux defaults TERM to tmux-256color).

# --- core ergonomics -------------------------------------------------------
set -g mouse on                    # scroll, click-to-focus, drag borders (default off)
set -g base-index 1                # window 1 under the 1 key (default 0)
setw -g pane-base-index 1
set -g renumber-windows on         # closing window 2 of 5 leaves no gap (default off)
set -g history-limit 50000         # default 2000 is nothing under a streaming agent
set -s focus-events on             # neovim autoread/FocusGained need this (default off)

# --- copy mode -------------------------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- splits open where you are, not where the session started --------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# --- scrollback in editor, like zellij's Ctrl s + e ------------------------
bind e run-shell 'f=$(mktemp -t scrollback); tmux capture-pane -p -S - -t #{pane_id} > "$f"; tmux new-window -n scrollback "nvim +\$ \"$f\"; rm -f \"$f\""'

# --- edit-reload loop ------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# --- coding agents (Claude Code + pi) --------------------------------------
# `always` not `on`: Claude Code never sends the kitty-keyboard activation
# sequence, so `on` leaves Shift+Enter broken (anthropics/claude-code#26629).
# csi-u is what pi documents as most reliable; it is the 3.7 default, set
# explicitly so this file survives older servers.
set -s extended-keys always
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'
# `all` not `on`: `on` drops notifications from panes in background windows,
# which is exactly when an agent finishing should reach you.
set -g allow-passthrough all

# --- theme -----------------------------------------------------------------
# One of: ayu | catppuccin | minimal. Switch by editing this line + prefix r,
# or preview live from any shell without editing:
#   tmux source ~/.config/tmux/themes/catppuccin.conf
source-file ~/.config/tmux/themes/minimal.conf
set -g popup-border-lines rounded

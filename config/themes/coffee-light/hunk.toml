# Hunk (brew "hunk"), the GitHub-style review stream: `hunk diff`, `hunk show <rev>`.
# Colours are Coffee Light, matching nvim, kitty, yazi, lazygit and the
# delta feature in ~/.gitconfig (diff backgrounds are the same 10%/20% tints).

theme = "coffee-light"
# Split at 160+ columns, unified below, like GitHub's layout switch.
mode = "split"
# kitty's opacity and blur show through, as in lazygit.
transparent_background = true
# Same as nvim's scrolloff.
scroll_off = 5
line_numbers = true
wrap_lines = false
hunk_headers = true
menu_bar = true
agent_notes = false
copy_decorations = false
cursor_line = "row"

[vcs]
# Working-tree reviews reload as files change (agents editing in another pane).
watch = true

[feedback]
enabled = false

[themes.coffee-light]
base = "github-light-default"
label = "Coffee Light"
background = "#faf4ed"
panel = "#f4ede7"
panelAlt = "#d2ccc5"
border = "#8a827c"
accent = "#027974"
accentMuted = "#eae4dd"
text = "#3d352b"
muted = "#5b544c"
contextBg = "#faf4ed"
contextContentBg = "#faf4ed"
addedBg = "#dae1cd"
removedBg = "#f9e2e0"
addedContentBg = "#cfd8bd"
removedContentBg = "#f5cfca"
addedSignColor = "#557a06"
removedSignColor = "#d04a47"
lineNumberBg = "#faf4ed"
lineNumberFg = "#5f584f"
selectedHunk = "#eae4dd"
badgeAdded = "#557a06"
badgeRemoved = "#d04a47"
badgeNeutral = "#027974"
fileNew = "#557a06"
fileDeleted = "#d04a47"
fileRenamed = "#c44b87"
fileModified = "#ae7504"
fileUntracked = "#067953"
noteBorder = "#c44b87"
noteBackground = "#d2ccc5"
noteTitleBackground = "#eae4dd"
noteTitleText = "#c44b87"


# Minimal — the original grey line, plus a single orange cue for focus.
set -g status-style "bg=default,fg=colour245"
set -g status-left "#{?client_prefix,#[fg=colour76]^ ,#[fg=colour245]_ }[#S] "
set -g status-left-length 30
set -g status-right ""
set -g status-right-length 0
set -g window-status-separator " "
set -g window-status-format "#I:#W#F"
set -g window-status-current-format "#[fg=#e5e1cf,bold]#I:#W#F"
set -g pane-border-style "fg=#243340"
set -g pane-active-border-style "fg=#f19618"
set -g message-style "fg=colour232,bg=colour245"
set -g message-command-style "fg=colour232,bg=colour245"
set -g mode-style "fg=#e5e1cf,bg=#243340"
set -g clock-mode-colour "colour245"

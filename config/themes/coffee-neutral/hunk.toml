# Hunk (brew "hunk"), the GitHub-style review stream: `hunk diff`, `hunk show <rev>`.
# Colours are Coffee Neutral, matching nvim, kitty, yazi, lazygit and the
# delta feature in ~/.gitconfig (diff backgrounds are the same 10%/20% tints).

theme = "coffee-neutral"
# Split at 160+ columns, unified below, like GitHub's layout switch.
mode = "split"
# kitty's 0.97 opacity and blur show through, as in lazygit.
transparent_background = true
# Same as nvim's scrolloff.
scroll_off = 5
line_numbers = true
wrap_lines = false
hunk_headers = true
menu_bar = true
agent_notes = false
copy_decorations = false
cursor_line = "row"

[vcs]
# Working-tree reviews reload as files change (agents editing in another pane).
watch = true

[feedback]
enabled = false

[themes.coffee-neutral]
base = "github-dark-default"
label = "Coffee Neutral"
background = "#191817"
panel = "#1e1d1c"
panelAlt = "#353332"
border = "#4d4c4a"
accent = "#6eddd6"
accentMuted = "#262323"
text = "#c2b7ab"
muted = "#9a9289"
contextBg = "#191817"
contextContentBg = "#191817"
addedBg = "#262a1d"
removedBg = "#2d1f1e"
addedContentBg = "#2b311f"
removedContentBg = "#3e2724"
addedSignColor = "#9dcc57"
removedSignColor = "#fe7069"
lineNumberBg = "#191817"
lineNumberFg = "#968e85"
selectedHunk = "#262323"
badgeAdded = "#9dcc57"
badgeRemoved = "#fe7069"
badgeNeutral = "#6eddd6"
fileNew = "#9dcc57"
fileDeleted = "#fe7069"
fileRenamed = "#e480ad"
fileModified = "#f7d979"
fileUntracked = "#3ceaa8"
noteBorder = "#e480ad"
noteBackground = "#353332"
noteTitleBackground = "#262323"
noteTitleText = "#e480ad"


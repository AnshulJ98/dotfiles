# Hunk (brew "hunk"), the GitHub-style review stream: `hunk diff`, `hunk show <rev>`.
# Colours are Ayu Ink, matching nvim, kitty, yazi, lazygit and the
# delta feature in ~/.gitconfig (diff backgrounds are the same 10%/20% tints).

theme = "ayu-ink"
# Split at 160+ columns, unified below, like GitHub's layout switch.
mode = "split"
# kitty's 0.97 opacity and blur show through, as in lazygit.
transparent_background = true
# Same as nvim's scrolloff.
scroll_off = 5
line_numbers = true
wrap_lines = false
hunk_headers = true
menu_bar = true
agent_notes = false
copy_decorations = false
cursor_line = "row"

[vcs]
# Working-tree reviews reload as files change (agents editing in another pane).
watch = true

[feedback]
enabled = false

[themes.ayu-ink]
base = "github-dark-default"
label = "Ayu Ink"
background = "#0e0d0c"
panel = "#0a0909"
panelAlt = "#2f2e2c"
border = "#484644"
accent = "#59c2ff"
accentMuted = "#1f1d1b"
text = "#c8ad85"
muted = "#9b8667"
contextBg = "#0e0d0c"
contextContentBg = "#0e0d0c"
addedBg = "#1e2112"
removedBg = "#251717"
addedContentBg = "#252c15"
removedContentBg = "#382020"
addedSignColor = "#aad94c"
removedSignColor = "#f07178"
lineNumberBg = "#0e0d0c"
lineNumberFg = "#968264"
selectedHunk = "#1f1d1b"
badgeAdded = "#aad94c"
badgeRemoved = "#f07178"
badgeNeutral = "#59c2ff"
fileNew = "#aad94c"
fileDeleted = "#f07178"
fileRenamed = "#f29668"
fileModified = "#ffb454"
fileUntracked = "#95e6cb"
noteBorder = "#f29668"
noteBackground = "#2f2e2c"
noteTitleBackground = "#1f1d1b"
noteTitleText = "#f29668"

# Generated from syntax.tmTheme: each comma-separated

#:schema https://yazi-rs.github.io/schemas/theme.json

# Soviet Dark, matching nvim and kitty. The defaults name ANSI
# colours, which kitty already maps to the theme's palette; only the entries
# that used "gray" (ANSI white here, so bright bars and borders) or reversed
# video need hex values.

[mgr]
cwd           = { fg = "#6ca0c6" }
border_symbol = "│"
border_style  = { fg = "#6e6d6b" }
syntect_theme = "~/.config/themes/current/syntax.tmTheme"

[tabs]
active   = { fg = "#d8cfc4", bg = "#343130", bold = true }
inactive = { fg = "#a3a187", bg = "#1a1818" }

[mode]
normal_main = { fg = "#1a1818", bg = "#6ca0c6", bold = true }
normal_alt  = { fg = "#76aad0", bg = "#3c3a3a" }
select_main = { fg = "#1a1818", bg = "#c58f9d", bold = true }
select_alt  = { fg = "#cc95a3", bg = "#3c3a3a" }
unset_main  = { fg = "#1a1818", bg = "#f07666", bold = true }
unset_alt   = { fg = "#fb8070", bg = "#3c3a3a" }

# nvim's CursorLine and Visual backgrounds, so file colours survive the hover.
[indicator]
parent  = { bg = "#3c3a3a" }
current = { bg = "#343130", bold = true }

[status]
progress_normal = { fg = "#b8ba73", bg = "#3c3a3a" }
progress_error  = { fg = "#fb8070", bg = "#3c3a3a" }

[which]
border          = { fg = "#6e6e6a" }
cand            = { fg = "#6ca0c6" }
rest            = { fg = "#a3a187" }
desc            = { fg = "#c58f9d" }
separator_style = { fg = "#6e6e6a" }

[confirm]
border = { fg = "#6e6e6a" }
title  = { fg = "#e9dfd0" }

[spot]
border = { fg = "#6e6e6a" }
title  = { fg = "#e9dfd0" }

[pick]
border = { fg = "#6e6e6a" }

[input]
border = { fg = "#6e6e6a" }

[cmp]
border = { fg = "#6e6e6a" }

[tasks]
border = { fg = "#6e6e6a" }

[help]
border = { fg = "#6e6e6a" }

# Same letters and colours as the neo-tree git column; staged edits are green
# as in `git status`.
[git]
untracked      = { fg = "#d29a69" }
unstaged       = { fg = "#6ca0c6" }
staged         = { fg = "#b8ba73" }
added          = { fg = "#b8ba73" }
deleted        = { fg = "#f07666" }
updated        = { fg = "#f07666", bold = true }
ignored        = { fg = "#a3a187" }
untracked_sign = "U"
unstaged_sign  = "M"
staged_sign    = "M"
added_sign     = "A"
deleted_sign   = "D"
updated_sign   = "!"
ignored_sign   = ""

# Soviet Dark: Vicinae colours, matching kitty.conf in this directory.

[meta]
version = 1
name = "Soviet Dark"
description = "soviet-dark palette (generated; file and theme name kept so settings need no change)."
variant = "dark"
inherits = "vicinae-dark"

[colors.core]
background = "#242222"            # editor.background
foreground = "#d8cfc4"            # editor.foreground
secondary_background = "#1a1818"  # sideBar.background
border = "#333230"                # editorWidget.border
accent = "#6ca0c6"                # terminal.ansiBlue
accent_foreground = "#242222"

[colors.accents]
blue = "#6ca0c6"
green = "#b8ba73"
magenta = "#c58f9d"
orange = "#d1b078"
purple = "#c58f9d"
red = "#f07666"
yellow = "#d1b078"
cyan = "#4ca9a4"

[colors.text]
muted = "#8e8882"        # descriptionForeground #d8cfc480
placeholder = "#a8a68d"  # input.placeholderForeground
danger = "#f07666"
success = "#b8ba73"
selection = { background = "#343230", foreground = "#d8cfc4" }

[colors.text.links]
default = "#e9dfd0"      # textLink.foreground

[colors.input]
border = "#484646"       # input.border
border_focus = "#555452" # focusBorder
border_error = "#f07666"

[colors.list.item.hover]
foreground = "#d8cfc4"
secondary_foreground = "#d8cfc4"

[colors.list.item.selection]
background = "#333230"   # list.activeSelectionBackground #8c8a7a73
foreground = "#d8cfc4"
secondary_background = "#3a3838"
secondary_foreground = "#d8cfc4"

[colors.grid.item]
background = "#3c3a3a"   # editorWidget.background

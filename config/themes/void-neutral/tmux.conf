# void-neutral (generated by theme.mjs; same layout as minimal.conf)
set -g status-style "bg=default,fg=colour8"
set -g status-left "#{?client_prefix,#[fg=colour2]^ ,#[fg=colour8]_ }[#S] "
set -g status-left-length 30
set -g status-right ""
set -g status-right-length 0
set -g window-status-separator " "
set -g window-status-format "#I:#W#F"
set -g window-status-current-format "#[fg=colour15,bold]#I:#W#F"
set -g pane-border-style "fg=#696969"
set -g pane-active-border-style "fg=#7fd7f5"
set -g message-style "fg=colour0,bg=colour7"
set -g message-command-style "fg=colour0,bg=colour7"
set -g mode-style "fg=#ededed,bg=#373737"
set -g clock-mode-colour "colour8"

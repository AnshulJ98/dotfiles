# Hunk (brew "hunk"), the GitHub-style review stream: `hunk diff`, `hunk show <rev>`.
# Colours are Dark 2026, matching nvim, kitty, yazi, lazygit and the
# delta feature in ~/.gitconfig (diff backgrounds are the same 10%/20% tints).

theme = "dark-2026"
# Split at 160+ columns, unified below, like GitHub's layout switch.
mode = "split"
# kitty's 0.97 opacity and blur show through, as in lazygit.
transparent_background = true
# Same as nvim's scrolloff.
scroll_off = 5
line_numbers = true
wrap_lines = false
hunk_headers = true
menu_bar = true
agent_notes = false
copy_decorations = false
cursor_line = "row"

[vcs]
# Working-tree reviews reload as files change (agents editing in another pane).
watch = true

[feedback]
enabled = false

[themes.dark-2026]
base = "github-dark-default"
label = "Dark 2026"
background = "#121314"
panel = "#18191a"
panelAlt = "#303233"
border = "#616264"
accent = "#79c0ff"
accentMuted = "#202122"
text = "#bbbebf"
muted = "#969fa8"
contextBg = "#121314"
contextContentBg = "#121314"
addedBg = "#1a251d"
removedBg = "#261d1b"
addedContentBg = "#1b251e"
removedContentBg = "#29201e"
addedSignColor = "#7ee787"
removedSignColor = "#f48771"
lineNumberBg = "#121314"
lineNumberFg = "#929ba5"
selectedHunk = "#202122"
badgeAdded = "#7ee787"
badgeRemoved = "#f48771"
badgeNeutral = "#79c0ff"
fileNew = "#7ee787"
fileDeleted = "#f48771"
fileRenamed = "#d2a8ff"
fileModified = "#e5ba7d"
fileUntracked = "#4ec9b0"
noteBorder = "#d2a8ff"
noteBackground = "#303233"
noteTitleBackground = "#202122"
noteTitleText = "#d2a8ff"

# Generated from config/yazi/dark-2026.tmTheme: each comma-separated
# scope of a rule becomes one key with that rule's foreground (later rules win).

# Colours (gui.theme) come from the active theme: LG_CONFIG_FILE in home/.zshrc merges
# ~/.config/themes/current/lazygit.yml over this file.
git:
  # `|` cycles the renderers; `+` / `_` change screen mode (full screen for the diff).
  # Delta styles live in the [delta "theme"] feature that ~/.gitconfig includes from the active theme.
  diffRenderers:
    - name: delta side-by-side
      command: delta --paging=never --features=theme --side-by-side --width={{width}}
    - name: delta inline
      command: delta --paging=never --features=theme --width={{width}}
    - name: git
      type: rawGit

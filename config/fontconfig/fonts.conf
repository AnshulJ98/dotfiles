<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Lets headless LibreOffice (the office skills' render step) use the
     Microsoft fonts the decks name, so previews match PowerPoint. Missing
     dirs are skipped, so one file serves the Mac and WSL. -->
<fontconfig>
  <!-- Mac: home/.zshenv points FONTCONFIG_FILE here, because LibreOffice's
       fontconfig skips the user file that Homebrew's config includes. -->
  <include ignore_missing="yes">/opt/homebrew/etc/fonts/fonts.conf</include>
  <!-- Office for Mac bundles Aptos, Calibri, Cambria, Segoe... (path checked on 16.115) -->
  <dir>/Applications/Microsoft PowerPoint.app/Contents/Resources/DFonts</dir>
  <!-- WSL: Windows fonts (Georgia, Arial, Calibri). Office's cloud fonts (Aptos)
       are linked into ~/.local/share/fonts/ms-cloud by install.sh. -->
  <dir>/mnt/c/Windows/Fonts</dir>
</fontconfig>

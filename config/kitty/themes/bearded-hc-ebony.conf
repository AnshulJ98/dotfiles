## name: Bearded HC Ebony
## author: BeardedBear (palette); kitty port from the VS Code theme JSON
## license: MIT
## upstream: https://github.com/BeardedBear/bearded-theme
## blurb: Near-neutral ebony base (#181820) with the HC Midnight Void accents; the terminal theme to sit under any pi theme.

# Source: bearded-theme-hc-ebony.json (editor.*, tab.*, terminal.ansi*). Pair with pi theme any.
# Alpha colours are flattened onto editor.background because kitty colours are opaque.
# color8 raised from terminal.ansiBrightBlack #424257 (1.8:1) to #646477 (3.0:1): bright black carries dim
# text in the shell (p10k, zsh-autosuggestions, ls, git) and must stay legible.

# --- Core ---
foreground              #c8c8d5
background              #181820
selection_foreground    none
selection_background    #53545d

# --- Cursor ---
cursor                  #F5DF76
cursor_text_color       #181820
cursor_trail_color      #F5DF76

# --- ANSI normal ---
color0                  #181820
color1                  #fd604f
color2                  #AFEA7B
color3                  #F5DF76
color4                  #7fd7f5
color5                  #e4a3df
color6                  #22D3B1
color7                  #c8c8d5

# --- ANSI bright ---
color8                  #646477
color9                  #ff5e4d
color10                 #aeff66
color11                 #ffe66c
color12                 #75dcff
color13                 #f691ee
color14                 #00f5c6
color15                 #ffffff

# --- URLs, borders, bell ---
url_color               #7fd7f5
active_border_color     #44445a
inactive_border_color   #0d0d11
bell_border_color       #F5DF76

# --- Tab bar ---
active_tab_foreground   #c8c8d5
active_tab_background   #282831
inactive_tab_foreground #505068
inactive_tab_background #13131a
tab_bar_background      #13131a
tab_bar_margin_color    #13131a

# --- Marks (mark1 info, mark2 warning, mark3 error) ---
mark1_foreground        #181820
mark1_background        #7fd7f5
mark2_foreground        #181820
mark2_background        #F5DF76
mark3_foreground        #181820
mark3_background        #fd604f

# --- macOS ---
macos_titlebar_color    background

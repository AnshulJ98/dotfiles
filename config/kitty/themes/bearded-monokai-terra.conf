## name: Bearded Monokai Terra
## author: BeardedBear (palette); kitty port from the VS Code theme JSON
## license: MIT
## upstream: https://github.com/BeardedBear/bearded-theme
## blurb: Warm grey base with the Monokai Pro style palette.

# Source: bearded-theme-monokai-terra.json (editor.*, tab.*, terminal.ansi*). Pair with pi theme bearded-monokai-terra.
# Alpha colours are flattened onto editor.background because kitty colours are opaque.
# color8 raised from terminal.ansiBrightBlack #564f5d (2.0:1) to #726b77 (3.0:1): bright black carries dim
# text in the shell (p10k, zsh-autosuggestions, ls, git) and must stay legible.

# --- Core ---
foreground              #d9d6db
background              #262329
selection_foreground    none
selection_background    #50494f

# --- Cursor ---
cursor                  #ffd866
cursor_text_color       #262329
cursor_trail_color      #ffd866

# --- ANSI normal ---
color0                  #262329
color1                  #fc6a67
color2                  #a9dc76
color3                  #ffd866
color4                  #78dce8
color5                  #e991e3
color6                  #78e8c6
color7                  #d9d6db

# --- ANSI bright ---
color8                  #726b77
color9                  #ff6764
color10                 #a9f65c
color11                 #ffd866
color12                 #61eeff
color13                 #fd7df4
color14                 #61ffcf
color15                 #ffffff

# --- URLs, borders, bell ---
url_color               #78dce8
active_border_color     #595260
inactive_border_color   #18171b
bell_border_color       #ffd866

# --- Tab bar ---
active_tab_foreground   #d9d6db
active_tab_background   #262329
inactive_tab_foreground #665f6d
inactive_tab_background #201e23
tab_bar_background      #201e23
tab_bar_margin_color    #201e23

# --- Marks (mark1 info, mark2 warning, mark3 error) ---
mark1_foreground        #262329
mark1_background        #78dce8
mark2_foreground        #262329
mark2_background        #ffd866
mark3_foreground        #262329
mark3_background        #fc6a67

# --- macOS ---
macos_titlebar_color    background

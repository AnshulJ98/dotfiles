## name: Bearded HC Midnight Void
## author: BeardedBear (palette); kitty port from the VS Code theme JSON
## license: MIT
## upstream: https://github.com/BeardedBear/bearded-theme
## blurb: High-contrast blue-black base with pastel accents.

# Source: bearded-theme-hc-midnightvoid.json (editor.*, tab.*, terminal.ansi*). Pair with pi theme bearded-hc-midnightvoid.
# Alpha colours are flattened onto editor.background because kitty colours are opaque.
# color8 raised from terminal.ansiBrightBlack #375165 (2.0:1) to #546c7e (3.0:1): bright black carries dim
# text in the shell (p10k, zsh-autosuggestions, ls, git) and must stay legible.

# --- Core ---
foreground              #c3d2de
background              #151f27
selection_foreground    none
selection_background    #515e68

# --- Cursor ---
cursor                  #F5DF76
cursor_text_color       #151f27
cursor_trail_color      #F5DF76

# --- ANSI normal ---
color0                  #151f27
color1                  #fd604f
color2                  #AFEA7B
color3                  #F5DF76
color4                  #7fd7f5
color5                  #e4a3df
color6                  #22D3B1
color7                  #c3d2de

# --- ANSI bright ---
color8                  #546c7e
color9                  #ff5e4d
color10                 #aeff66
color11                 #ffe66c
color12                 #75dcff
color13                 #f691ee
color14                 #00f5c6
color15                 #ffffff

# --- URLs, borders, bell ---
url_color               #dbefff
active_border_color     #395469
inactive_border_color   #0c1116
bell_border_color       #F5DF76

# --- Tab bar ---
active_tab_foreground   #c3d2de
active_tab_background   #253039
inactive_tab_foreground #436179
inactive_tab_background #111920
tab_bar_background      #111920
tab_bar_margin_color    #111920

# --- Marks (mark1 info, mark2 warning, mark3 error) ---
mark1_foreground        #151f27
mark1_background        #7fd7f5
mark2_foreground        #151f27
mark2_background        #F5DF76
mark3_foreground        #151f27
mark3_background        #fd604f

# --- macOS ---
macos_titlebar_color    background

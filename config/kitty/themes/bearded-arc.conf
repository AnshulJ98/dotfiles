## name: Bearded Arc
## author: BeardedBear (palette); kitty port from the VS Code theme JSON
## license: MIT
## upstream: https://github.com/BeardedBear/bearded-theme
## blurb: Arc: navy base, vivid neon accents.

# Source: bearded-theme-arc.json (editor.*, tab.*, terminal.ansi*). Pair with pi theme bearded-arc.
# Alpha colours are flattened onto editor.background because kitty colours are opaque.
# color8 raised from terminal.ansiBrightBlack #3e4f71 (1.9:1) to #606e8b (3.0:1): bright black carries dim
# text in the shell (p10k, zsh-autosuggestions, ls, git) and must stay legible.

# --- Core ---
foreground              #d0d7e4
background              #1c2433
selection_foreground    none
selection_background    #3a465a

# --- Cursor ---
cursor                  #EACD61
cursor_text_color       #1c2433
cursor_trail_color      #EACD61

# --- ANSI normal ---
color0                  #1c2433
color1                  #E35535
color2                  #3CEC85
color3                  #EACD61
color4                  #69C3FF
color5                  #F38CEC
color6                  #22ECDB
color7                  #d0d7e4

# --- ANSI bright ---
color8                  #606e8b
color9                  #ff4319
color10                 #29ff82
color11                 #ffd94c
color12                 #69c3ff
color13                 #ff80f6
color14                 #0fffeb
color15                 #ffffff

# --- URLs, borders, bell ---
url_color               #69C3FF
active_border_color     #405275
inactive_border_color   #131822
bell_border_color       #EACD61

# --- Tab bar ---
active_tab_foreground   #d0d7e4
active_tab_background   #1c2433
inactive_tab_foreground #4a5e84
inactive_tab_background #181f2c
tab_bar_background      #181f2c
tab_bar_margin_color    #181f2c

# --- Marks (mark1 info, mark2 warning, mark3 error) ---
mark1_foreground        #1c2433
mark1_background        #69C3FF
mark2_foreground        #1c2433
mark2_background        #EACD61
mark3_foreground        #1c2433
mark3_background        #E35535

# --- macOS ---
macos_titlebar_color    background

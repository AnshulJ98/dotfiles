# Clicked file links (pi tool headers, rg/ls hyperlinks) open in nvim over the
# current window; :q returns to it. Everything else keeps the macOS default.
# The ext entry is needed because kitty guesses MIME from the extension and
# maps .ts to video/mp2t, so `mime text/*` alone misses TypeScript.

protocol file
fragment_matches [0-9]+
action launch --type=overlay --cwd=current nvim +${FRAGMENT} -- ${FILE_PATH}

protocol file
ext ts,tsx,mts,cts,js,mjs,cjs,jsx,json,jsonc,md,py,sh,zsh,bash,lua,toml,yaml,yml,conf,go,rs,rb,java,kt,swift,c,h,cpp,hpp,css,scss,html,sql,txt,ini,xml,tf,env,lock
action launch --type=overlay --cwd=current nvim -- ${FILE_PATH}

protocol file
mime text/*
action launch --type=overlay --cwd=current nvim -- ${FILE_PATH}

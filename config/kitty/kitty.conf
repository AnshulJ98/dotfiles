# Kitty config — aligned with WezTerm + Ghostty (Bearded Monokai Black Pro Filter)

# === Font ===
font_size        16.0

# Disable discretionary ligatures (matches WezTerm harfbuzz_features = { "dlig=0" })
font_features Iosevka-Term -dlig
font_features Iosevka-Term-Bold -dlig
font_features Iosevka-Term-Italic -dlig
font_features Iosevka-Term-BoldItalic -dlig

# Borrow Powerline glyphs (U+E0A0-U+E0BF) from Iosevka Nerd Font Mono.
# Iosevka Term lacks PUA glyphs, so app output containing  /
# would otherwise render as blank tofu. Used by ccstatusline statusline.
symbol_map U+E0A0-U+E0BF Iosevka Nerd Font Mono

# === Cursor ===
# cursor                 #ffee00
# cursor_text_color      #0a0a0a
cursor_shape           beam
cursor_beam_thickness  1.5
cursor_blink_interval  0
# Enable the cursor trail (values larger than 0 set the length of the trail)
cursor_trail 3

# (Optional) Adjust how fast the trail fades (defaults to usually work well, but you can tweak it)
cursor_trail_decay 0.1 0.9

# === Notification ===
notify_on_cmd_finish unfocused

# === Colors — Bearded Monokai Black Pro Filter ===
# foreground #c7c7c7
# background #000000
# selection_foreground #c7c7c7
# selection_background #3b3b3b

# Normal
# color0  #141414
# color1  #ff5555
# color2  #66ff88
# color3  #ffee00
# color4  #44ddff
# color5  #ff44ff
# color6  #44ffcc
# color7  #c7c7c7

# Bright
# color8  #444444
# color9  #ff3333
# color10 #88ff44
# color11 #ffee00
# color12 #00eeff
# color13 #ff44ff
# color14 #00ffcc
# color15 #fafafa

# === Window ===
background_opacity     0.97 
background_blur        20
hide_window_decorations titlebar-only
window_padding_width   2
placement_strategy     center
remember_window_size   yes
confirm_os_window_close -1
# active_border_color    #8f8f8f
# inactive_border_color  #050505
window_border_width    1pt

# === Layouts ===
enabled_layouts splits,tall,fat,grid,stack

# === Tab bar ===
tab_bar_edge           top
tab_bar_style          powerline
tab_bar_align 	       left
tab_separator	       " "
tab_bar_min_tabs       2
tab_bar_margin_height  0 0
tab_bar_margin_width   0
# active_tab_background  #66CCFF
active_tab_font_style  bold
# inactive_tab_foreground #545454
# inactive_tab_background #0e0e0e
inactive_tab_font_style normal
# tab_bar_background     #060606

# Tab title templating — inject per-state foreground color based on title markers.
# Contract:
#   "π ..."   → cyan   #44ddff   main pi window
#   "↳ ... ✓" → green  #66ff88   spawn completed successfully
#   "↳ ... ✗" → red    #ff5555   spawn failed
#   "↳ ..."    → orange #ff8844   spawn in progress
#   "↻ ..."    → purple #cc88ff   replay (historical, read-only)
#   otherwise → default tab fg
tab_title_template     "{fmt.fg._66ff88 if '✓' in title else (fmt.fg._ff5555 if '✗' in title else (fmt.fg._cc88ff if title.startswith('↻') else (fmt.fg._ff8844 if title.startswith('↳') else (fmt.fg._44ddff if title.startswith('π') else fmt.fg.tab))))}{title}{fmt.fg.tab}"
active_tab_title_template "{fmt.fg._66ff88 if '✓' in title else (fmt.fg._ff5555 if '✗' in title else (fmt.fg._cc88ff if title.startswith('↻') else (fmt.fg._ff8844 if title.startswith('↳') else (fmt.fg._44ddff if title.startswith('π') else fmt.fg.tab))))}{fmt.bold}{title}{fmt.nobold}{fmt.fg.tab}"

# === URLs ===
# General URL clicking (markdown links, URLs in terminal output).
url_prefixes          default
detect_urls           yes

# Make Cmd+Click open URLs on macOS (kitty's default is Ctrl+Shift+Click —
# Cmd+Click is what Mac users expect). This augments the defaults; the default
# Ctrl+Shift+Click still works too.
mouse_map cmd+left release ungrabbed  mouse_click_url
mouse_map cmd+left press   ungrabbed  discard_event
detect_urls    yes
# url_color      #44ddff
url_style      curly

# === Scrollback ===
scrollback_lines 250000
# `env LESSUTFCHARDEF=...` marks Unicode Private Use Area codepoints (Nerd Font /
# Powerline glyphs: U+E000-U+F8FF, plus supplementary PUA planes) as printable so
# less renders them via the font instead of showing <U+XXXX> placeholders.
# Ranges: BMP PUA, SPUA-A, SPUA-B. Keeps `-R` for safe ANSI handling.
scrollback_pager env LESSUTFCHARDEF=E000-F8FF:p,F0000-FFFFD:p,100000-10FFFD:p /usr/bin/less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
# Disk-backed pager history: retains full ANSI colors, ~1M ASCII lines per 100MB
scrollback_pager_history_size 100

# === Bell ===
enable_audio_bell no

# === Shell integration ===
shell_integration enabled

# === Remote control ===
allow_remote_control yes
listen_on unix:/tmp/kitty-socket

# === macOS ===
macos_option_as_alt yes
macos_quit_when_last_window_closed yes
# macos_titlebar_color background

# === Keyboard shortcuts ===
# New tab (Cmd+Enter like WezTerm)
map cmd+enter new_tab_with_cwd
# Close tab (Cmd+W)
map cmd+w close_tab
# New window (Cmd+N)
map cmd+n new_os_window
# Word navigation (Option+Arrow like WezTerm)
map alt+left send_text all \x1bb
map alt+right send_text all \x1bf
# Tab navigation
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9
# Font size
map cmd+equal change_font_size all +1.0
map cmd+minus change_font_size all -1.0
map cmd+0 change_font_size all 0
# Split panes
map cmd+d         launch --location=vsplit --cwd=current
map cmd+shift+d   launch --location=hsplit --cwd=current
# Pane navigation
map cmd+opt+left    neighboring_window left
map cmd+opt+right   neighboring_window right
map cmd+opt+up      neighboring_window up
map cmd+opt+down    neighboring_window down
# Pane resize
map cmd+ctrl+left   resize_window narrower 2
map cmd+ctrl+right  resize_window wider 2
map cmd+ctrl+up     resize_window taller 2
map cmd+ctrl+down   resize_window shorter 2
# Layout cycling
map cmd+shift+l     next_layout
# URL and path hints
map cmd+shift+e open_url_with_hints
map cmd+shift+f kitten hints --type path --program -
map cmd+shift+g kitten hints --type linenum

# Old scrollback mappings (replaced by kitty-scrollback.nvim)
# map alt+shift+e launch --stdin-source=@screen_scrollback --stdin-add-formatting --type=overlay nvim -c "set local buftype=nofile foldcolumn=0 signcolumn=no" -c "autocmd TermOpen * startinsert" -c "normal G"
# scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})\' +\'set nomodified nolist\' +\'$\' -
# map alt+shift+e pipe @screen_scrollback overlay nvim - -c 'set filetype=scrollback' -c 'source ~/.config/nvim/ftplugin/scrollback.vim'
# map alt+shift+e launch --type=overlay --stdin-source=@screen_scrollback --stdin-add-formatting nvim - -c 'set filetype=scrollback' -c 'source ~/.config/nvim/ftplugin/scrollback.vim'
# map cmd+f show_scrollback
# map ctrl+shift+h launch --type=overlay --stdin-source=@screen_scrollback --stdin-add-formatting --env LESSUTFCHARDEF=E000-F8FF:p,F0000-FFFFD:p,100000-10FFFD:p /usr/bin/less +G -R

# kitty-scrollback.nvim
action_alias kitty_scrollback_nvim kitten '/Users/anshulj/.local/share/nvim/site/pack/kitty-scrollback/start/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py'
map kitty_mod+h kitty_scrollback_nvim
map kitty_mod+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output

# BEGIN_KITTY_FONTS
font_family      family="Iosevka Term"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS


# BEGIN_KITTY_THEME
# Ayu
include current-theme.conf

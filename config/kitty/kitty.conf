# Kitty config — aligned with WezTerm + Ghostty (Bearded Monokai Black Pro Filter)

# === Font ===
font_size        18.0
# VS Code on macOS sets line height to 1.5x font size (GOLDEN_LINE_HEIGHT_RATIO,
# src/vs/editor/common/config/fontInfo.ts); Iosevka's own leading is far tighter.
# kitty draws box-drawing and Powerline glyphs itself, so guides and borders
# stretch to the taller cell without gaps.
modify_font cell_height 120%

# Disable discretionary ligatures (matches WezTerm harfbuzz_features = { "dlig=0" })
font_features Iosevka-Term -dlig
font_features Iosevka-Term-Bold -dlig
font_features Iosevka-Term-Italic -dlig
font_features Iosevka-Term-BoldItalic -dlig

# Borrow Powerline glyphs (U+E0A0-U+E0BF) from Iosevka Nerd Font Mono.
# Iosevka Term lacks PUA glyphs, so app output containing  /
# would otherwise render as blank tofu. Used by ccstatusline statusline.
symbol_map U+E0A0-U+E0BF Iosevka Nerd Font Mono

# === Cursor ===
# cursor                 #ffee00
# cursor_text_color      #0a0a0a
cursor_shape           beam
cursor_beam_thickness  1.5
cursor_blink_interval  0
# Enable the cursor trail (values larger than 0 set the length of the trail)
cursor_trail 3

# (Optional) Adjust how fast the trail fades (defaults to usually work well, but you can tweak it)
cursor_trail_decay 0.1 0.9
# Bundled kitty 0.49 shader; `bloom` smears bold text, this one is subtle
custom_shaders cursor-trail-motion-blur

# === Notification ===
notify_on_cmd_finish unfocused 10.0

# === Colors — Bearded Monokai Black Pro Filter ===
# foreground #c7c7c7
# background #000000
# selection_foreground #c7c7c7
# selection_background #3b3b3b

# Normal
# color0  #141414
# color1  #ff5555
# color2  #66ff88
# color3  #ffee00
# color4  #44ddff
# color5  #ff44ff
# color6  #44ffcc
# color7  #c7c7c7

# Bright
# color8  #444444
# color9  #ff3333
# color10 #88ff44
# color11 #ffee00
# color12 #00eeff
# color13 #ff44ff
# color14 #00ffcc
# color15 #fafafa

# === Window ===
background_opacity     0.94
background_blur        44
dim_opacity            0.6
# transparent_background_colors is set by the theme (config/themes/<name>/kitty.conf):
# nvim's panel background keeps its tint at 0.95 instead of going opaque.
hide_window_decorations titlebar-only
window_padding_width   2
placement_strategy     center
remember_window_size   yes
confirm_os_window_close -1
# active_border_color    #8f8f8f
# inactive_border_color  #050505
window_border_width    1pt

# === Layouts ===
enabled_layouts splits,tall,fat,grid,stack

# === Window title bars ===
# Off (0 = never show). The bar only renders {title}, which shell integration
# sets to the cwd, so every pane read "~" and refreshed only at the next
# prompt. Focus is signalled by inactive_text_alpha and active_border_color
# at the bottom of this file instead. No other useful variable is exposed to
# window_title_template.
window_title_bar_min_windows 0

# === Tab bar ===
tab_bar_edge           top
# powerline tabs plus the workspace number and time at the right end (tab_bar.py)
tab_bar_style          custom
tab_bar_align 	       left
tab_separator	       " "
# Always shown: with tab_bar_filter the bar could appear without kitty resizing the panes under it (0.50.0)
tab_bar_min_tabs       1
tab_bar_margin_height  0 0
tab_bar_margin_width   0
# active_tab_background  #66CCFF
active_tab_font_style  bold
# inactive_tab_foreground #545454
# inactive_tab_background #0e0e0e
inactive_tab_font_style normal
# tab_bar_background     #060606

# Split indicator prefix, prepended to both tab templates:
#   ""      one window in the tab, nothing to show
#   "▍3 "   three windows, all visible (splits/tall/fat/grid)
#   "█3 "   three windows, one zoomed over the rest (stack layout)
# Block glyphs are plain box drawing, present in Iosevka Term, so no tofu.

# Tab title templating — inject per-state foreground color based on title markers.
# {tab.program_status} is the agent state a program reports over OSC 7501 (pi does).
# Contract:
# Colours use the active theme's ANSI palette:
#   "π ..."   → cyan    main pi window
#   "↳ ... ✓" → green   spawn completed successfully
#   "↳ ... ✗" → red     spawn failed
#   "↳ ..."    → yellow  spawn in progress
#   "↻ ..."    → magenta replay (historical, read-only)
#   otherwise → default tab fg
tab_title_template     "{tab.program_status}{fmt.fg.color3}{('█' if layout_name == 'stack' else '▍') + str(num_window_groups) + ' ' if num_window_groups > 1 else ''}{fmt.fg.color2 if '✓' in title else (fmt.fg.color1 if '✗' in title else (fmt.fg.color5 if title.startswith('↻') else (fmt.fg.color3 if title.startswith('↳') else (fmt.fg.color6 if title.startswith('π') else fmt.fg.tab))))}{title}{fmt.fg.tab}"
active_tab_title_template "{tab.program_status}{fmt.fg.color3}{('█' if layout_name == 'stack' else '▍') + str(num_window_groups) + ' ' if num_window_groups > 1 else ''}{fmt.fg.color2 if '✓' in title else (fmt.fg.color1 if '✗' in title else (fmt.fg.color5 if title.startswith('↻') else (fmt.fg.color3 if title.startswith('↳') else (fmt.fg.color6 if title.startswith('π') else fmt.fg.tab))))}{fmt.bold}{title}{fmt.nobold}{fmt.fg.tab}"

# === URLs ===
# General URL clicking (markdown links, URLs in terminal output).
url_prefixes          default
detect_urls           yes

# Make Cmd+Click open URLs on macOS (kitty's default is Ctrl+Shift+Click —
# Cmd+Click is what Mac users expect). This augments the defaults; the default
# Ctrl+Shift+Click still works too.
mouse_map cmd+left release ungrabbed  mouse_click_url
mouse_map cmd+left press   ungrabbed  discard_event
# url_color      #44ddff
url_style      curly

# === Scrollback ===
scrollback_lines 250000
# `env LESSUTFCHARDEF=...` marks Unicode Private Use Area codepoints (Nerd Font /
# Powerline glyphs: U+E000-U+F8FF, plus supplementary PUA planes) as printable so
# less renders them via the font instead of showing <U+XXXX> placeholders.
# Ranges: BMP PUA, SPUA-A, SPUA-B. Keeps `-R` for safe ANSI handling.
scrollback_pager env LESSUTFCHARDEF=E000-F8FF:p,F0000-FFFFD:p,100000-10FFFD:p /usr/bin/less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
# Disk-backed pager history: retains full ANSI colors, ~1M ASCII lines per 100MB
scrollback_pager_history_size 100

# === Bell ===
enable_audio_bell no

# === Shell integration ===
shell_integration enabled

# === Panes live in zmx ===
# Every pane's shell runs inside a zmx session (bin/zshell), so closing a pane, a tab or kitty
# only detaches it. cmd+alt+g (bin/zgoto) lists sessions to reattach or kill; cmd+alt+t opens a
# plain pane outside zmx. Comment out the shell line to turn it all off.
shell $HOME/.config/kitty/bin/zshell
# Programs kitty starts without a shell (cmd+alt+l's hunk) never read .zshrc;
# without this, hunk's `e` (open file in editor) has no $EDITOR.
env EDITOR=nvim

# === Workspaces ===
# A workspace is a kitty session: the tab bar shows only the current one's tabs. workspaces.py
# saves each open workspace's tabs, splits and panes to ~/.local/state/kitty/workspaces, so a
# closed workspace reopens whole from the Go to picker. bin/kmain (AeroSpace cmd-enter) starts
# the one kitty that opens on the main workspace; every other kitty starts without one. That
# kitty reopens the workspaces that were open when it last ran. Every workspace tab gets a left
# sidebar dock (bin/zside): spaces on top, agents below; click a row to go there.
tab_bar_filter session:~ or session:^$
watcher workspaces.py
restore_session_after_logout yes

# === Remote control ===
allow_remote_control yes
listen_on unix:/tmp/kitty-socket

# === macOS ===
macos_option_as_alt yes
macos_quit_when_last_window_closed yes
# macos_titlebar_color background

# === Keyboard shortcuts ===
# Cmd+Enter is not listed: AeroSpace binds it globally to launch kitty, so a
# mapping here never fires. Cmd+T opens a tab with its dock in the current directory.
# Neovim maps Alt+Enter to maximize or restore its integrated terminal.
map cmd+shift+enter send_text all \x1b\r
# kitty's default cmd+alt+s turns on Secure Keyboard Entry, which persists across launches and
# blocks AeroSpace's global shortcuts whenever kitty has focus. Too easy to hit next to cmd+alt+g.
map cmd+alt+s
# Close the pane (its zmx session stays; cmd+alt+g brings it back), or the whole tab
map cmd+w close_window
map cmd+shift+w close_tab
map cmd+t kitten zdo.py tab here
map cmd+n new_os_window_with_cwd
map cmd+shift+t kitten zdo.py tab
map cmd+shift+i set_tab_title
# A workspace on the live folder in its own window; cmd+n is free-form, in no workspace
map cmd+shift+n kitten zdo.py new window
# Word navigation (Option+Arrow like WezTerm)
map alt+left send_text all \x1bb
map alt+right send_text all \x1bf
# Tab navigation
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9
# Font size
map cmd+equal change_font_size all +1.0
map cmd+minus change_font_size all -1.0
map cmd+0 change_font_size all 0
# Split panes
map cmd+d         launch --location=vsplit --cwd=current
map cmd+shift+d   launch --location=hsplit --cwd=current
# Pane navigation
map cmd+opt+left    neighboring_window left
map cmd+opt+right   neighboring_window right
map cmd+opt+up      neighboring_window up
map cmd+opt+down    neighboring_window down
# Pane resize
map cmd+ctrl+left   resize_window narrower 2
map cmd+ctrl+right  resize_window wider 2
map cmd+ctrl+up     resize_window taller 2
map cmd+ctrl+down   resize_window shorter 2
# Layout cycling
map cmd+shift+l     next_layout
# Zoom the focused split to fill the tab, and back. toggle_layout returns to the
# previous layout, and kitty caches one layout object per tab (_used_layouts in
# kitty/tabs.py), so the splits tree and its resize biases survive the trip.
map cmd+alt+f       toggle_layout stack
# Required by the zoom above: in the stack layout no window has neighbours, so
# the cmd+opt+arrow neighboring_window bindings are dead and the hidden windows
# would be unreachable.
map cmd+shift+] next_window
map cmd+shift+[ previous_window
# Go to: full-tab picker of workspaces, tabs and panes, then detached zmx sessions and closed
# workspaces. Pressed again in the picker it switches to detached and closed only.
map cmd+alt+g remote_control_script bin/zgoto @active-kitty-window-id
# Workspaces: zdo.py passes the live folder to bin/zws (shift asks for the name), close
# detaches its panes; zdo.py switches by number or in order on kitty's UI thread.
map cmd+alt+n kitten zdo.py new
map cmd+alt+shift+n kitten zdo.py new ask
map cmd+alt+w       close_session .
map cmd+alt+1 kitten zdo.py switch 1
map cmd+alt+2 kitten zdo.py switch 2
map cmd+alt+3 kitten zdo.py switch 3
map cmd+alt+4 kitten zdo.py switch 4
map cmd+alt+5 kitten zdo.py switch 5
map cmd+alt+6 kitten zdo.py switch 6
map cmd+alt+7 kitten zdo.py switch 7
map cmd+alt+8 kitten zdo.py switch 8
map cmd+alt+9 kitten zdo.py switch 9
map ctrl+alt+[ kitten zdo.py prev
map ctrl+alt+] kitten zdo.py next
# Go to an agent on kitty's UI thread, numbered as in the sidebar's list
map ctrl+alt+1 kitten zdo.py agent 1
map ctrl+alt+2 kitten zdo.py agent 2
map ctrl+alt+3 kitten zdo.py agent 3
map ctrl+alt+4 kitten zdo.py agent 4
map ctrl+alt+5 kitten zdo.py agent 5
map ctrl+alt+6 kitten zdo.py agent 6
map ctrl+alt+7 kitten zdo.py agent 7
map ctrl+alt+8 kitten zdo.py agent 8
map ctrl+alt+9 kitten zdo.py agent 9
# Hide or show the sidebar (workspaces.py reacts to the user var). A right click on one of its
# spaces offers rename, close and worktrees.
map cmd+alt+b remote_control set-user-vars zside=toggle
# Keys popup (bin/zkeys shows keys.txt); pressed again it closes
map cmd+/ remote_control_script bin/zkeys
# Hunk review for the current folder in a full tab of its own: it joins no workspace, so it gets no
# sidebar and is not saved with one. q closes it. Run lazygit for staging and other git actions.
map cmd+alt+l launch --type=tab --tab-title hunk --add-to-session=! --cwd=current /opt/homebrew/bin/hunk diff
map cmd+alt+t launch --type=tab --cwd=current /bin/zsh -il
# Same scrollback editor as ctrl+shift+h.
map cmd+alt+e kitty_scrollback_nvim

# Tab detach/reattach
map cmd+shift+b     detach_tab
map cmd+shift+j     detach_tab ask
# Plain-text file references (tsc, rg, go test, stack traces) become clickable
# like URLs; open-actions.conf routes them to nvim at the line. kitty 0.50+
# (released 2026-11-03); 0.49 logs it as unknown and carries on.
detect_url_regex [[:alnum:]_./~-]+\.[[:alnum:]]+:[0-9]+
# URL and path hints
map cmd+shift+e open_url_with_hints
map cmd+shift+f kitten hints --type path --program -
map cmd+shift+g kitten hints --type linenum

# Old scrollback mappings (replaced by kitty-scrollback.nvim)
# map alt+shift+e launch --stdin-source=@screen_scrollback --stdin-add-formatting --type=overlay nvim -c "set local buftype=nofile foldcolumn=0 signcolumn=no" -c "autocmd TermOpen * startinsert" -c "normal G"
# scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})\' +\'set nomodified nolist\' +\'$\' -
# map alt+shift+e pipe @screen_scrollback overlay nvim - -c 'set filetype=scrollback' -c 'source ~/.config/nvim/ftplugin/scrollback.vim'
# map alt+shift+e launch --type=overlay --stdin-source=@screen_scrollback --stdin-add-formatting nvim - -c 'set filetype=scrollback' -c 'source ~/.config/nvim/ftplugin/scrollback.vim'
# map cmd+f show_scrollback
# map ctrl+shift+h launch --type=overlay --stdin-source=@screen_scrollback --stdin-add-formatting --env LESSUTFCHARDEF=E000-F8FF:p,F0000-FFFFD:p,100000-10FFFD:p /usr/bin/less +G -R

# kitty-scrollback.nvim
action_alias kitty_scrollback_nvim kitten '~/.local/share/nvim/site/pack/core/opt/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py'
map kitty_mod+h kitty_scrollback_nvim
map kitty_mod+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output

# BEGIN_KITTY_FONTS
font_family      family="Iosevka Term"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS


# This machine only, untracked: for example  env GIT_CEILING_DIRECTORIES=/opt/homebrew
# (globinclude, because a plain include logs an error when the file is missing)
globinclude local.conf

# BEGIN_KITTY_THEME
# config/themes/current is a symlink to the active theme; `theme <name>` repoints it.
include ../themes/current/kitty.conf
# END_KITTY_THEME

# === Split focus indicators (the theme sets active_border_color) ===
# Fade the text of every unfocused split.
# inactive_text_alpha 0.95
# Loud outline around the focused split. draw_minimal_borders yes (the default)
# paints only the edge shared with a neighbour, which is one line in the middle
# of the screen. Turning it off draws all four edges per window, and a 1pt
# margin keeps adjacent windows' borders from collapsing into one shared line.
draw_minimal_borders no
window_margin_width 0
window_border_width 1pt
# Rounded corners on those outlines (kitty 0.49; full borders only). They are
# drawn over the corner cells, so the radius stays inside window_padding_width
# (8pt) to keep text clear of them.
window_border_radius 6pt

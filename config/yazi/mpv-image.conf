# mpv keys for yazi's image opener (yazi.toml [opener].image). Added on top of
# mpv's defaults, so q quits and Alt+arrows still pan.

# Zoom is log2: +0.25 is about 19% larger per press.
=  add video-zoom  0.25
+  add video-zoom  0.25
-  add video-zoom -0.25

# h/j/k/l move the view, so the image slides the other way.
h  add video-pan-x  0.05
l  add video-pan-x -0.05
k  add video-pan-y  0.05
j  add video-pan-y -0.05
H  add video-pan-x  0.15
L  add video-pan-x -0.15
K  add video-pan-y  0.15
J  add video-pan-y -0.15

0  set video-zoom 0; set video-pan-x 0; set video-pan-y 0

# Several selected images open as a playlist.
n  playlist-next
N  playlist-prev

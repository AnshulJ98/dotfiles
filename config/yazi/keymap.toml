#:schema https://yazi-rs.github.io/schemas/keymap.json

# Only prepends: every default not rebound here keeps working, and upstream
# changes to the defaults arrive without a merge.
[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "Enter the directory, or open the file"

[[mgr.prepend_keymap]]
on   = "f"
run  = "plugin jump-to-char"
desc = "Jump to the next file starting with a char"

[[mgr.prepend_keymap]]
on   = "F"
run  = "plugin smart-filter"
desc = "Filter as you type; enters a sole directory match"

[[mgr.prepend_keymap]]
on   = "T"
run  = "plugin toggle-pane max-preview"
desc = "Maximize or restore the preview pane"

# + and - zoom like mpv and every image viewer; the absolute symlink that
# owned - moves to =, and _ still makes a relative one.
[[mgr.prepend_keymap]]
on   = "+"
run  = "plugin zoom 1"
desc = "Zoom the image preview in"

[[mgr.prepend_keymap]]
on   = "-"
run  = "plugin zoom -1"
desc = "Zoom the image preview out"

[[mgr.prepend_keymap]]
on   = "="
run  = "link"
desc = "Symlink the absolute path of yanked files"

[[mgr.prepend_keymap]]
on   = [ "g", "s" ]
run  = "plugin vcs-files"
desc = "Show Git changes"

[[mgr.prepend_keymap]]
on   = [ "c", "p" ]
run  = "plugin diff"
desc = "Copy a patch of the selected file against the hovered one"

[[mgr.prepend_keymap]]
on   = [ "b", "a" ]
run  = "plugin mactag add"
desc = "Add a Finder tag to the selected files"

[[mgr.prepend_keymap]]
on   = [ "b", "r" ]
run  = "plugin mactag remove"
desc = "Remove a Finder tag from the selected files"

# herdr runs inside kitty: kitty keeps fonts, cursor, blur and the theme; herdr
# adds the server that keeps panes alive after kitty closes, plus pi's
# working/blocked/idle state (`herdr integration install pi`).
# Unset keys use the defaults: `herdr --default-config`.
# Check with `herdr config check`; apply with `herdr server reload-config`.

onboarding = false

[theme]
# Draw herdr's UI from kitty's palette (Bearded HC Midnight Void).
name = "terminal"

[keys]
# kitty hands these chords to Herdr only in windows marked by kitty-herdr.
# Keep the earlier Ctrl+Alt and prefix bindings as fallbacks. Herdr's help
# lists bindings in this order, so the direct chord goes first.
split_vertical   = ["cmd+d", "ctrl+alt+d", "prefix+v"]
split_horizontal = ["cmd+shift+d", "ctrl+alt+shift+d", "prefix+minus"]
focus_pane_left  = ["cmd+alt+left", "ctrl+alt+h", "prefix+h"]
focus_pane_down  = ["cmd+alt+down", "ctrl+alt+j", "prefix+j"]
focus_pane_up    = ["cmd+alt+up", "ctrl+alt+k", "prefix+k"]
focus_pane_right = ["cmd+alt+right", "ctrl+alt+l", "prefix+l"]
resize_pane_left  = "cmd+ctrl+left"
resize_pane_down  = "cmd+ctrl+down"
resize_pane_up    = "cmd+ctrl+up"
resize_pane_right = "cmd+ctrl+right"
zoom             = ["cmd+alt+f", "ctrl+alt+f", "prefix+z"]
new_tab          = ["cmd+t", "ctrl+alt+t", "prefix+c"]
close_pane       = ["cmd+w", "prefix+x"]
close_tab        = ["cmd+shift+w", "prefix+shift+x"]
# kitty's own set_tab_title chord.
rename_tab       = ["cmd+shift+i", "prefix+shift+t"]
switch_tab       = ["cmd+1..9", "prefix+1..9"]
switch_workspace = "cmd+alt+1..9"
focus_agent      = "ctrl+alt+1..9"
new_workspace    = ["cmd+alt+n", "prefix+shift+n"]
new_worktree     = ["cmd+alt+shift+n", "prefix+shift+g"]
close_workspace  = ["cmd+alt+w", "prefix+shift+d"]
help             = ["cmd+/", "prefix+?"]
goto             = ["cmd+alt+g", "ctrl+alt+g", "prefix+g"]
toggle_sidebar   = ["cmd+alt+b", "ctrl+alt+b", "prefix+b"]
# kitty_mod+h would show herdr's screen, not the pane's history; this opens
# the focused pane's scrollback in $EDITOR.
edit_scrollback  = ["cmd+alt+e", "ctrl+alt+e", "prefix+e"]
last_pane        = "ctrl+alt+o"                        # back-and-forth, across workspaces
previous_workspace = "ctrl+alt+["
next_workspace     = "ctrl+alt+]"

[ui]
sidebar_width = 24
sidebar_min_width = 24
sidebar_max_width = 24
# Collapsed (ctrl+alt+b), the sidebar takes no columns; "compact" keeps a
# narrow agent-status rail.
sidebar_collapsed_mode = "hidden"
status_indicators = "symbols"
accent = "#44ddff"
pane_scrollbars = false
pane_outer_borders = false
pane_gaps = false
tab_bar_position = "top"
tab_bar_right = [
  { type = "zoom" },
  { type = "command", command = "git branch --show-current 2>/dev/null", interval_seconds = 10 },
  { type = "datetime", format = "%H:%M" },
]
tab_bar_right_separator = " │ "
prompt_new_tab_name = false
hide_tab_bar_when_single_tab = false
# Pass the focused pane's title to kitty's tab, as before herdr, so the
# tab_title_template colours still apply.
window_title = "{terminal_title}"
# Default true: herdr owns clicks and Ctrl-click opens only http(s) links.
# false hands OSC 8 links back to kitty (open-actions.conf opens files in
# nvim) but drops herdr's click-to-focus and border dragging.
# mouse_capture = true

[ui.toast]
# kitty shows the desktop notification (OSC 99) when a background agent
# finishes or needs input.
delivery = "terminal"

[experimental]
# Replay each pane's recent screen after a full server restart (the processes
# still end). Off by default because saved screens can hold tokens and
# prompts; herdr writes them to session-history.json beside session.json,
# outside this repo, since only config.toml is linked.
pane_history = true

[[keys.command]]
key = "ctrl+alt+shift+g"
type = "popup"
command = "lazygit"
width = "90%"
height = "90%"

[[keys.command]]
key = "cmd+alt+l"
type = "popup"
command = "lazygit"
width = "90%"
height = "90%"

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

[ui.sidebar.agents]
rows = [["state_icon", "agent", "tab"], ["$model", "$context_usage"]]

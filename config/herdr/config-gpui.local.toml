# Herdr UI overrides; config-gpui.toml beside the link lists every key.
# Saved changes reload automatically. The app's Settings and
# `herdr-gpui config set` write here too, so keep this file tidy after them.
# Panes are the same daemon session as herdr in kitty (config.toml), so its
# [keys] ctrl+alt chords work here as well. Below: the look and Cmd keys of
# kitty.conf.

layout = "comfortable-rounded"
contrast = "standard"
theme = "~/Dev/dotfiles/config/herdr/themes/bearded-hc-midnightvoid"
# kitty's macos_option_as_alt yes: both Option keys send Alt, which the
# ctrl+alt chords, nvim and the shell expect.
option_as_alt = true

[keybindings]
# kitty's cmd+alt+f zooms; cmd+shift+enter is a newline for pi (pane_keys).
toggle_zoom = "cmd-alt-f"

[pane_keys]
# kitty.conf: map cmd+shift+enter send_text all \x1b\r
"cmd-shift-enter" = "alt-enter"

[terminal]
family = "Iosevka Term"
# Iosevka Term has no Nerd Font icons; kitty borrows them the same way.
fallback = ["Iosevka Nerd Font Mono"]
size = 18
# A multiple of size, not of the font's own height: kitty's 120% cell_height
# on Iosevka's 1.25em rows is 1.5 here.
line_height = 1.5
padding_x = 2
padding_y = 2

# The sidebar and tab strip are terminal-drawn in herdr, so in Iosevka too.
[sidebar]
family = "Iosevka Term"
fallback = ["Iosevka Nerd Font Mono"]

[tabs]
family = "Iosevka Term"
fallback = ["Iosevka Nerd Font Mono"]
size = 13.0

[backdrop]
opacity = 0.96
blur = true

[notifications]
# config.toml sends toasts to the outer terminal (kitty's OSC 99); this app is
# the terminal here, so it shows them itself.
enabled = true

[ui]
family = "Iosevka Nerd Font"
size = 13.0

[status_bar]
theme = "hidden"

[code]
mode = "start"
license_accepted = true
port = 53412

[agent_skill]
# Its skills are not wanted in ~/.agents or ~/.claude; "off" stops it
# reinstalling them.
install = "off"

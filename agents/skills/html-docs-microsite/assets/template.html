<!doctype html>
<html lang="en" data-theme="{{theme}}">
  <head>
    <meta charset="utf-8" />
    <title>{{title}}</title>
    <script>
      document.documentElement.classList.add("js");
      try {
        const key = "hdm:" + document.title + ":" + location.pathname;
        const saved = JSON.parse(localStorage.getItem(key)) || {};
        if (saved.mode ?? matchMedia("(prefers-color-scheme: dark)").matches)
          document.documentElement.dataset.mode = "dark";
      } catch {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="only light" />
    <meta name="darkreader-lock" />
    <style>
      {{style}}
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <header class="topbar">
      <div class="brand">
        {{brand}}
        <div><strong>{{title}}</strong><small>{{subtitle}}</small></div>
      </div>
      <div class="tools">
        <button
          id="t-menu"
          type="button"
          aria-expanded="false"
          aria-controls="sidebar"
        >
          Menu
        </button>
        <button id="t-outline" type="button" aria-pressed="false">
          Hide outline
        </button>
        <button id="t-width" type="button" aria-pressed="false">Wide</button>
        <button id="t-mode" type="button" aria-pressed="false">Dark</button>
        <button id="t-print" type="button">Print</button>
      </div>
    </header>
    <button
      id="drawer-backdrop"
      type="button"
      aria-label="Close menu"
      tabindex="-1"
    ></button>
    <aside class="sidebar" id="sidebar">
      <div class="side-head">
        <strong>{{title}}</strong><small>{{subtitle}}</small>
      </div>
      <input
        id="q"
        type="search"
        aria-label="Search documentation"
        placeholder="Search  /"
        autocomplete="off"
      />
      <nav id="nav">{{nav}}</nav>
      <ol id="results" hidden></ol>
      {{footer}}
    </aside>
    <main id="main" tabindex="-1">
      <div id="route-notice" hidden></div>
      {{pages}}
    </main>
    <dialog id="viewer" aria-label="Figure viewer">
      <div class="bar">
        <button
          type="button"
          data-act="out"
          title="Zoom out (-)"
          aria-label="Zoom out"
        >
          &minus;</button
        ><span class="pct"></span
        ><button
          type="button"
          data-act="in"
          title="Zoom in (+)"
          aria-label="Zoom in"
        >
          +</button
        ><button type="button" data-act="actual" title="Actual size (1)">
          1:1</button
        ><button type="button" data-act="reset" title="Fit (0)">Fit</button
        ><button type="button" data-act="close" title="Close (Escape)">
          Close
        </button>
      </div>
      <div class="stage"></div>
    </dialog>
    <!-- prettier-ignore -->
    <script>{{script}}</script>
  </body>
</html>

<!doctype html>
<html lang="en" data-theme="{{theme}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="only light" />
    <meta name="darkreader-lock" />
    <title>{{title}}</title>
    <style>
      {{style}}
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <strong>{{title}}</strong><small>{{subtitle}}</small>
      </div>
      <div class="tools">
        <button id="t-outline" type="button">Hide outline</button>
        <button id="t-width" type="button">Wide</button>
        <button id="t-mode" type="button">Dark</button>
        <button id="t-print" type="button">Print</button>
      </div>
    </header>
    <aside class="sidebar">
      <input id="q" type="search" placeholder="Search  /" autocomplete="off" />
      <nav id="nav">{{nav}}</nav>
      <ol id="results" hidden></ol>
    </aside>
    <main>{{pages}}</main>
    <dialog id="viewer">
      <div class="bar">
        <button type="button" data-act="out" aria-label="Zoom out">
          &minus;</button
        ><span class="pct"></span
        ><button type="button" data-act="in" aria-label="Zoom in">+</button
        ><button type="button" data-act="reset">Fit</button
        ><button type="button" data-act="close">Close</button>
      </div>
      <div class="stage"></div>
    </dialog>
    <script>
      {
        {
          script;
        }
      }
    </script>
  </body>
</html>
